# Plink's public demo on Render. Her own copy runs on the family laptop (`make dev`).
# The app and API share one web service. Gemma 4 runs on Google's Gemini API and TabPFN
# on Prior Labs' API, not on Render. Logins and each user's practice live in Render Postgres.
databases:
  # Free: Render deletes it 30 days after creation (plus 14 days' grace), with no backups.
  - name: plink-db
    plan: free
    # Next to TabPFN's API (Google Cloud, Netherlands): a pick makes several round trips there.
    region: frankfurt
    # No connections from outside Render; the web service reaches it over the private network.
    ipAllowList: []

services:
  - type: web
    name: plink
    runtime: docker
    region: frankfurt
    # Free: with both models on APIs, the app peaks well under the plan's 512 MB. It sleeps
    # after 15 minutes without visitors, and the next visit waits about a minute.
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plink-db
          property: connectionString
      # Signs login tokens. Generated once; changing it logs everyone out.
      - key: JWT_SECRET
        generateValue: true
      # Each new account starts with simulated practice, so TabPFN has a log to learn from.
      - key: DEMO_SEED
        value: "true"
      # Gemma 4 on the Gemini API. The mixture-of-experts model (4B active) was as accurate
      # as the dense gemma-4-31b-it in testing, and 5-10x faster.
      - key: GEMINI_MODEL
        value: gemma-4-26b-a4b-it
      # Asked for when the Blueprint is created: a Gemini API key from Google AI Studio.
      - key: GEMINI_API_KEY
        sync: false
      # TabPFN on Prior Labs' API (tabpfn-client), so the image carries no torch. On the
      # 373-row demo log each call costs 10k tokens; a free account gets 5M a day, 20M a month.
      - key: TABPFN_CLOUD
        value: "true"
      # The API's default is v3.5; the spec asks for TabPFN-3, as on the laptop.
      - key: TABPFN_MODEL_VERSION
        value: v3
      - key: TABPFN_DISABLE_TELEMETRY
        value: "1"
      # Asked for when the Blueprint is created: an API key from platform.priorlabs.ai/account/api-keys.
      - key: TABPFN_TOKEN
        sync: false
