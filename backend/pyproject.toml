[project]
name = "plink-backend"
version = "0.1.0"
description = "Plink local API: attempt log, TabPFN drill picker, Gemma coach"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tabpfn>=9.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
