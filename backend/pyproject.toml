[project]
name = "plink-backend"
version = "0.1.0"
description = "Plink local API: attempt log, TabPFN drill picker, Gemma coach"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tabpfn-client>=0.6",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
]

[tool.uv]
default-groups = ["dev", "local"]

# Render has no GPUs, and the default Linux torch wheel pulls gigabytes of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8"]
# TabPFN on this machine. The Render image leaves it out (--no-default-groups) and calls
# Prior Labs' hosted TabPFN instead (TABPFN_CLOUD), so it needs no torch.
local = ["tabpfn>=9.0", "torch>=2.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
