# Optional. `make dev` is the normal way to run Plink; the browser still runs on the host.
services:
  ollama:
    image: ollama/ollama
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama:/root/.ollama]
  backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app/backend
    command: sh -c "uv sync && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma4:e4b}
      TABPFN_TOKEN: ${TABPFN_TOKEN:-}
    ports: ["127.0.0.1:8000:8000"]
    volumes: [".:/app", "backend-venv:/app/backend/.venv"]
    depends_on: [ollama]
volumes:
  ollama:
  backend-venv:
